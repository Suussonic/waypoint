name: Discord release announcement

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: discord-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  announce:
    if: github.repository == 'the-geeky-couldron/waypoint'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    steps:
      - name: Check out the trusted default-branch announcer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Announce the published release
        env:
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
          WAYPOINT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          WAYPOINT_RELEASE_URL: ${{ github.event.release.html_url }}
          WAYPOINT_RELEASE_NOTES: ${{ github.event.release.body }}
        run: python3 .github/scripts/announce_discord_release.py
