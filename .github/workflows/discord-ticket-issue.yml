name: Discord ticket to issue

# Turns a Discord support ticket into a GitHub issue.
#
# Trigger: POST https://api.github.com/repos/<owner>/<repo>/dispatches
#   {"event_type": "discord-ticket", "client_payload": {...}}
# Payload fields: ticket_id, category (bug or feature), subject, description,
# app_version, device, android_version. Only the submitted form is public.
#
# repository_dispatch only runs the workflow file on the default branch.

on:
  repository_dispatch:
    types: [discord-ticket]

permissions:
  issues: write

concurrency:
  group: discord-ticket-${{ github.event.client_payload.ticket_id }}
  cancel-in-progress: false

jobs:
  create-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      T_ID: ${{ github.event.client_payload.ticket_id }}
      T_CATEGORY: ${{ github.event.client_payload.category }}
      T_SUBJECT: ${{ github.event.client_payload.subject }}
      T_DESCRIPTION: ${{ github.event.client_payload.description }}
      T_APP_VERSION: ${{ github.event.client_payload.app_version }}
      T_DEVICE: ${{ github.event.client_payload.device }}
      T_ANDROID: ${{ github.event.client_payload.android_version }}
    steps:
      - name: Create the issue once per ticket
        shell: python3 {0}
        run: |
          import json, os, re, subprocess, sys

          def clean(name, limit):
              value = os.environ.get(name, "").strip()
              # Break @mentions so a ticket cannot ping people or teams.
              value = value.replace("@", "@​")
              return value[:limit]

          ticket_id = os.environ.get("T_ID", "").strip()
          if not re.fullmatch(r"[0-9A-Za-z_-]{1,20}", ticket_id):
              sys.exit("ticket_id is missing or not a plain ticket number")

          category = os.environ.get("T_CATEGORY", "").strip().lower()
          if category not in {"bug", "feature"}:
              sys.exit("Only bug and feature tickets may create a public issue")

          subject = re.sub(r"\s+", " ", clean("T_SUBJECT", 80))
          description = clean("T_DESCRIPTION", 4000)
          if len(subject) < 5 or len(description) < 10:
              sys.exit("A clear ticket subject and description are required")
          title = f"[Discord {category}] {subject}"

          # One issue per ticket, even if the bridge retries.
          found = subprocess.run(
              ["gh", "issue", "list", "--state", "all", "--limit", "100",
               "--search", f'"atlas-ticket:{ticket_id}" in:body',
               "--json", "number,body"],
              check=True, capture_output=True, text=True).stdout
          for issue in json.loads(found):
              if f"<!-- atlas-ticket:{ticket_id} -->" in (issue.get("body") or ""):
                  print(f"Ticket {ticket_id} already has issue #{issue['number']}")
                  sys.exit(0)

          labels = ["discord-ticket", "bug" if category == "bug" else "enhancement"]

          def row(label, value):
              return f"| {label} | {value or '-'} |\n"

          body = "## What was reported\n\n"
          body += description
          body += "\n\n## Details\n\n| | |\n|---|---|\n"
          body += row("App version", clean("T_APP_VERSION", 40))
          body += row("Device", clean("T_DEVICE", 80))
          body += row("Android version", clean("T_ANDROID", 40))
          body += row("Category", category[:30])
          body += f"\n---\nRaised automatically from a Waypoint Discord ticket. Private replies are not copied.\n<!-- atlas-ticket:{ticket_id} -->\n"

          subprocess.run(
              ["gh", "label", "create", "discord-ticket", "--color", "5865F2",
               "--description", "Raised from the Discord ticket system", "--force"],
              check=True)

          with open("body.md", "w", encoding="utf-8") as handle:
              handle.write(body)
          cmd = ["gh", "issue", "create", "--title", title, "--body-file", "body.md"]
          for label in labels:
              cmd += ["--label", label]
          subprocess.run(cmd, check=True)
