name: Main source guard

# Pull requests into main must come from the dev branch of this repository.
# Branch protection on main requires the "Only dev can merge into main" check.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  only_dev:
    name: Only dev can merge into main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require dev as the source branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Pull requests into main must come from the dev branch of $BASE_REPO. Retarget this pull request to dev."
            exit 1
          fi
