name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    # Bot-only main pushes must not publish a new Android release. GitHub does
    # not evaluate path filters for tag pushes, so explicit v* tags still work.
    paths-ignore:
      - 'tools/waypoint-discord-bot/**'
      - '.github/workflows/discord-ticket-issue.yml'
      - '.github/workflows/android.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare verified release
    if: >-
      (github.ref_type == 'branch' && github.ref_name == 'main') ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      tag: ${{ steps.plan.outputs.tag }}
      tag_exists: ${{ steps.plan.outputs.tag_exists }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Find the successful Android build for this commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_REF_TYPE" = branch ]; then
            test "$EVENT_REF_NAME" = main
          else
            test "$EVENT_REF_TYPE" = tag
            case "$EVENT_REF_NAME" in v*) ;; *) echo 'Only v* tags can publish releases.'; exit 1 ;; esac
          fi

          run_id=''
          for attempt in $(seq 1 180); do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/runs?head_sha=${RELEASE_SHA}&event=push&per_page=100")"
            main_run="$(jq -c --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.path == ".github/workflows/android.yml" and .head_branch == "main" and .head_sha == $sha)] | sort_by(.run_number) | last // empty' <<<"$run_json")"
            if [ -n "$main_run" ]; then
              status="$(jq -r '.status' <<<"$main_run")"
              if [ "$status" = completed ]; then
                conclusion="$(jq -r '.conclusion' <<<"$main_run")"
                if [ "$conclusion" = success ]; then
                  run_id="$(jq -r '.id' <<<"$main_run")"
                  break
                fi
                echo "Matching main Android run finished with ${conclusion}."
                exit 1
              fi
            fi
            echo "Waiting for the Android run for ${RELEASE_SHA} (${attempt}/180)"
            sleep 20
          done
          test -n "$run_id" || { echo "No successful Android run found for ${RELEASE_SHA}."; exit 1; }
          {
            echo "release_sha=$RELEASE_SHA"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"
      - name: Check out the verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.release_sha }}
      - name: Check version and release notes
        run: python3 scripts/check_version.py
      - name: Decide whether this version needs publishing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          test -n "$version"
          tag="v$version"
          if [ "$EVENT_REF_TYPE" = tag ] && [ "$EVENT_REF_NAME" != "$tag" ]; then
            echo "Tag $EVENT_REF_NAME does not match version.properties ($tag)."
            exit 1
          fi
          if [ "$EVENT_REF_TYPE" = branch ] && [ "$EVENT_REF_NAME" != main ]; then
            echo "Unexpected branch $EVENT_REF_NAME for release publishing."
            exit 1
          fi

          tag_exists=false
          tag_sha=''
          if tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null)"; then
            tag_exists=true
            object_type="$(jq -r '.object.type' <<<"$tag_ref")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            while [ "$object_type" = tag ]; do
              tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<<"$tag_object")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            done
            test "$object_type" = commit || { echo "Tag $tag does not point to a commit."; exit 1; }
            tag_sha="$object_sha"
            test "$tag_sha" = "$RELEASE_SHA" || { echo "Tag $tag already points to a different commit; choose a new version."; exit 1; }
          fi

          publish=true
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$tag_exists" = true || { echo "Release $tag exists without its tag."; exit 1; }
            publish=false
            echo "Release $tag is already published for this commit; nothing to do."
          fi
          {
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish signed APK and release notes
    if: needs.prepare.outputs.publish == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - name: Check out the verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Download signed APK from the matching Android run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Waypoint-signed-apk
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify downloaded release artifact
        run: (cd release && sha256sum --check --strict SHA256SUMS)
      - name: Verify signed APK build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify release/Waypoint.apk --repo "$GITHUB_REPOSITORY"
      - name: Create an annotated version tag if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          if tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            object_type="$(jq -r '.object.type' <<<"$tag_ref")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            while [ "$object_type" = tag ]; do
              tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<<"$tag_object")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            done
            test "$object_type" = commit
            test "$object_sha" = "$RELEASE_SHA" || { echo "Tag $RELEASE_TAG now points to a different commit."; exit 1; }
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          tag_object="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Waypoint $version" \
            -f object="$RELEASE_SHA" \
            -f type=commit --jq '.sha')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" -f sha="$tag_object" >/dev/null
      - name: Publish the verified GitHub release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG was published while this job waited for approval."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$RELEASE_TAG" release/Waypoint.apk release/SHA256SUMS \
            --verify-tag --title "Waypoint $RELEASE_TAG" \
            --notes-file docs/releases/current.md --latest
          echo "created=true" >> "$GITHUB_OUTPUT"
          delimiter="RELEASE_NOTES_$(openssl rand -hex 16)"
          {
            echo "release_notes<<$delimiter"
            cat docs/releases/current.md
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Announce the newly published release in Discord
        if: steps.publish_release.outputs.created == 'true'
        env:
          DISCORD_ANNOUNCEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK_URL }}
          WAYPOINT_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          WAYPOINT_RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
          WAYPOINT_RELEASE_NOTES: ${{ steps.publish_release.outputs.release_notes }}
        run: python3 .github/scripts/announce_discord_release.py
