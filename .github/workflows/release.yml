name: Release

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Android']
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare verified release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      tag: ${{ steps.plan.outputs.tag }}
      tag_exists: ${{ steps.plan.outputs.tag_exists }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Find the successful Android build for this commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            test "$WORKFLOW_EVENT" = push
            test "$WORKFLOW_BRANCH" = main
            test "$WORKFLOW_CONCLUSION" = success
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}")"
            test "$(jq -r '.path' <<<"$run_json")" = .github/workflows/android.yml
            test "$(jq -r '.head_branch' <<<"$run_json")" = main
            test "$(jq -r '.head_sha' <<<"$run_json")" = "$EVENT_SHA"
            test "$(jq -r '.event' <<<"$run_json")" = push
            test "$(jq -r '.conclusion' <<<"$run_json")" = success
            run_id="$WORKFLOW_RUN_ID"
            release_sha="$EVENT_SHA"
          else
            release_sha="$EVENT_SHA"
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android.yml/runs?head_sha=${release_sha}&event=push&per_page=100")"
            main_run="$(jq -c --arg sha "$release_sha" '[.workflow_runs[] | select(.path == ".github/workflows/android.yml" and .head_branch == "main" and .head_sha == $sha and .conclusion == "success")] | sort_by(.run_number) | last // empty' <<<"$run_json")"
            test -n "$main_run" || { echo 'No successful main Android build exists for this tag.'; exit 1; }
            run_id="$(jq -r '.id' <<<"$main_run")"
          fi
          {
            echo "release_sha=$release_sha"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"
      - name: Check out the verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.release_sha }}
      - name: Check version and release notes
        run: python3 scripts/check_version.py
      - name: Decide whether this version needs publishing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          test -n "$version"
          tag="v$version"
          if [ "$EVENT_NAME" = push ] && [ "$EVENT_TAG" != "$tag" ]; then
            echo "Tag $EVENT_TAG does not match version.properties ($tag)."
            exit 1
          fi

          tag_exists=false
          tag_sha=''
          if tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null)"; then
            tag_exists=true
            object_type="$(jq -r '.object.type' <<<"$tag_ref")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            while [ "$object_type" = tag ]; do
              tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<<"$tag_object")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            done
            test "$object_type" = commit || { echo "Tag $tag does not point to a commit."; exit 1; }
            tag_sha="$object_sha"
            test "$tag_sha" = "$RELEASE_SHA" || { echo "Tag $tag already points to a different commit; choose a new version."; exit 1; }
          fi

          publish=true
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$tag_exists" = true || { echo "Release $tag exists without its tag."; exit 1; }
            publish=false
            echo "Release $tag is already published for this commit; nothing to do."
          fi
          {
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish signed APK and release notes
    if: needs.prepare.outputs.publish == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Download signed APK from the matching Android run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Waypoint-signed-apk
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify downloaded release artifact
        run: (cd release && sha256sum --check --strict SHA256SUMS)
      - name: Create an annotated version tag if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          if tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            object_type="$(jq -r '.object.type' <<<"$tag_ref")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            while [ "$object_type" = tag ]; do
              tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<<"$tag_object")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            done
            test "$object_type" = commit
            test "$object_sha" = "$RELEASE_SHA" || { echo "Tag $RELEASE_TAG now points to a different commit."; exit 1; }
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          tag_object="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Waypoint $version" \
            -f object="$RELEASE_SHA" \
            -f type=commit --jq '.sha')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" -f sha="$tag_object" >/dev/null
      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG was published while this job waited for approval."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release/Waypoint.apk release/SHA256SUMS \
            --verify-tag --title "Waypoint $RELEASE_TAG" \
            --notes-file docs/releases/current.md --latest
