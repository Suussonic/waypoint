# GitHub reads this file from the default branch. Security PRs target main.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle-compatible:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /tools/style-validation
      - /tools/waypoint-motion
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The motion tool's Remotion ESLint config currently pins TypeScript 5.9.3.
    # Revisit this when its parser supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      npm-compatible:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-compatible:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
